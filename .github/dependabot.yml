version: 2
updates:
  # .NET NuGet dependencies (all csproj files under the repo root)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Bumping this build-time ANTLR code generator forces grammar regeneration,
      # which requires a Java toolchain in every build/CI environment. Pin it
      # manually and upgrade deliberately rather than on Dependabot's schedule.
      - dependency-name: "Antlr4BuildTasks"

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Python bindings
  - package-ecosystem: "pip"
    directory: "/bindings/python"
    schedule:
      interval: "weekly"
